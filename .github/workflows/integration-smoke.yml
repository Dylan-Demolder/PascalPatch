name: integration-smoke
# Manual, user-data-only Dolphin smoke. Dispatched by the PAS-12 verification
# run and pinned to the dedicated self-hosted runner label.
on:
  workflow_dispatch:
    inputs:
      dolphin:
        description: Absolute path to dolphin-emu on the self-hosted runner
        required: true
        type: string
      clean_iso:
        description: Absolute path to the user-owned clean GALE01 Rev.02 ISO
        required: true
        type: string
      modified_iso:
        description: Absolute path to the generated modified ISO
        required: true
        type: string
jobs:
  smoke:
    runs-on: [self-hosted, meleemod-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded clean/modified Dolphin smoke
        shell: bash
        env:
          DOLPHIN: ${{ inputs.dolphin }}
          CLEAN_ISO: ${{ inputs.clean_iso }}
          MODIFIED_ISO: ${{ inputs.modified_iso }}
        run: |
          PYTHONPATH=host/src python tooling/dolphin_smoke.py \
            --dolphin "$DOLPHIN" \
            --clean "$CLEAN_ISO" \
            --modified "$MODIFIED_ISO" \
            --timeout 30
      - name: Run non-game integration tests
        run: PYTHONPATH=host/src python -m unittest discover -s host/tests -v
