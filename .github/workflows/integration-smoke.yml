name: integration-smoke
# Manual, user-data-only Dolphin smoke, pinned to the self-hosted runner label.
# Self-contained: builds the modified ISO on the runner from the runner's own
# clean ISO plus the synthetic fixture in tooling/fixtures/pas23/. PAS-24
# overlays the Studio-composed fighter archive onto its clone-slot file so
# the game image references the custom bytes. Dispatch with no inputs.
# No game data is stored by the repo.
on:
  workflow_dispatch:
    inputs:
      dolphin:
        description: Absolute path to dolphin-emu (blank = auto-detect on the runner)
        required: false
        type: string
      clean_iso:
        description: Absolute path to the clean GALE01 Rev.02 ISO (blank = auto-detect)
        required: false
        type: string
      modified_iso:
        description: Absolute path to the modified ISO (blank = reuse clean)
        required: false
        type: string
      movie:
        description: Runner-local Dolphin TAS movie/DTM file
        required: false
        type: string
      record_movie:
        description: Record a legitimate DTM on the self-hosted runner
        required: false
        default: false
        type: boolean
      expected_archive:
        description: Runner-local custom fighter archive expected after conversion
        required: false
        type: string
      expected_symbol:
        description: Custom fighter load symbol or log marker
        required: false
        type: string
      expected_data:
        description: Runner-local custom fighter data file expected after conversion
        required: false
        type: string
      expected_observation:
        description: In-game observation marker emitted by the linked OSReport hook
        required: false
        default: CUSTOM_FIGHTER_VISIBLE
        type: string
      decomp_repo:
        description: Runner-local pinned doldecomp/melee checkout
        required: true
        type: string
      decomp_orig:
        description: Runner-local extracted orig/GALE01 directory
        required: true
        type: string
      expected_character_select:
        description: Character-select completion marker emitted by the runtime
        required: false
        default: CHARACTER_SELECT_COMPLETE
        type: string
      expected_match_start:
        description: Offline-match start marker emitted by the runtime
        required: false
        default: OFFLINE_MATCH_STARTED
        type: string
      expected_input_automation_ready:
        description: Input automation readiness marker emitted after menu navigation
        required: false
        default: INPUT_AUTOMATION_READY
        type: string

jobs:
  record:
    if: inputs.record_movie == true
    runs-on: [self-hosted, meleemod-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Record legitimate DTM
        shell: bash
        env:
          DOLPHIN: ${{ inputs.dolphin }}
          ISO: ${{ inputs.clean_iso }}
          MAX_SECONDS: "120"
        run: |
          set -euo pipefail
          test -n "${DISPLAY:-}" || { echo "DISPLAY is required" >&2; exit 2; }
          command -v xdotool >/dev/null || { echo "xdotool is required" >&2; exit 2; }
          [ -x "$DOLPHIN" ] || DOLPHIN="$(command -v dolphin-emu || true)"
          [ -x "$DOLPHIN" ] || { echo "Dolphin executable not found" >&2; exit 2; }
          [ -f "$ISO" ] || ISO="$(find "$HOME" /home -maxdepth 6 -type f -iname '*.iso' 2>/dev/null | head -1)"
          [ -f "$ISO" ] || { echo "Melee ISO not found" >&2; exit 2; }
          DTM="$RUNNER_TEMP/pas44-menu-to-match.dtm"
          LOG="$RUNNER_TEMP/pas44-dolphin.log"
          rm -f "$DTM" "$LOG"
          "$DOLPHIN" -e "$ISO" >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          WINDOW="$(xdotool search --sync --onlyvisible --name 'Dolphin' 2>/dev/null | head -1 || true)"
          [ -n "$WINDOW" ] || WINDOW="$(xdotool search --sync --onlyvisible --class dolphin 2>/dev/null | head -1 || true)"
          [ -n "$WINDOW" ] || { xdotool search --onlyvisible --name . 2>&1 || true; echo "Dolphin window not found" >&2; exit 1; }
          xdotool windowactivate --sync "$WINDOW"
          sleep 3
          xdotool key ctrl+F11
          sleep 2
          xdotool key Return
          sleep 4
          xdotool key Return
          sleep 4
          xdotool key Return
          sleep 4
          xdotool key Return
          sleep 4
          xdotool key ctrl+F11
          sleep 2
          xdotool key ctrl+s
          sleep 2
          xdotool key ctrl+a
          xdotool type --delay 20 "$DTM"
          xdotool key Return
          sleep 3
          test -s "$DTM"
          tail -n 80 "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: pas44-dtm
          path: ${{ runner.temp }}/pas44-menu-to-match.dtm
          if-no-files-found: error

  smoke:
    runs-on: [self-hosted, meleemod-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve emulator and game data
        id: resolve
        shell: bash
        run: |
          set +e
          echo "runner=$(hostname) user=$(whoami) home=$HOME display=${DISPLAY:-<unset>} pwd=$(pwd)"
          D="${{ inputs.dolphin }}"
          C="${{ inputs.clean_iso }}"
          echo "--- provided dolphin=$D"; ls -la "$D" 2>&1
          echo "--- provided clean=$C";   ls -la "$C" 2>&1
          [ -x "$D" ] || D="$(command -v dolphin-emu 2>/dev/null)"
          [ -n "$D" ] || D="$(command -v dolphin 2>/dev/null)"
          [ -n "$D" ] || D="$(find "$HOME/Downloads" "$HOME/.config/Slippi Launcher" -maxdepth 4 -type f -iname '*.AppImage' 2>/dev/null | head -1)"
          [ -n "$D" ] || D="$(find /usr /opt /home -maxdepth 6 -type f \( -iname 'dolphin-emu*' -o -iname 'Dolphin*.AppImage' \) 2>/dev/null | head -1)"
          [ -n "$C" ] || C="$(find "$HOME" /home -maxdepth 6 -type f -iname '*.iso' 2>/dev/null | head -1)"
          echo "resolved dolphin=$D"; ls -la "$D" 2>&1
          echo "resolved clean=$C";   ls -la "$C" 2>&1
          { echo "dolphin=$D"; echo "clean=$C"; } >> "$GITHUB_OUTPUT"
      - name: Build linked DOL and modified ISO on the runner
        id: build
        shell: bash
        env:
          CLEAN_ISO: ${{ steps.resolve.outputs.clean }}
          DECOMP_REPO: ${{ inputs.decomp_repo }}
          DECOMP_ORIG: ${{ inputs.decomp_orig }}
          OBSERVATION: ${{ inputs.expected_observation }}
        run: |
          set -euo pipefail
          FIXTURE="$GITHUB_WORKSPACE/tooling/fixtures/pas23"
          OUT="${RUNNER_TEMP:-/tmp}/pas23-modified.iso"
          PYTHONPATH=host/src python tooling/build_pas24_modified_iso.py \
            --clean "$CLEAN_ISO" --fixture "$FIXTURE" --output "$OUT" \
            --decomp-repo "$DECOMP_REPO" --orig "$DECOMP_ORIG" \
            --observation "$OBSERVATION" | tee "${RUNNER_TEMP:-/tmp}/pas24-build.json"
          test -s "$OUT"
          echo "modified=$OUT" >> "$GITHUB_OUTPUT"
          echo "archive=$FIXTURE/leesin-hsd-2e.melee-character" >> "$GITHUB_OUTPUT"
          echo "data=$FIXTURE/leesin-patched.hsd" >> "$GITHUB_OUTPUT"
          echo "symbol=ftDataLeesinhsd2e" >> "$GITHUB_OUTPUT"
          echo "observation=$OBSERVATION" >> "$GITHUB_OUTPUT"

      - name: Run bounded clean/modified Dolphin smoke
        shell: bash
        env:
          DOLPHIN: ${{ steps.resolve.outputs.dolphin }}
          CLEAN_ISO: ${{ steps.resolve.outputs.clean }}
          MODIFIED_ISO_IN: ${{ inputs.modified_iso }}
          BUILD_MODIFIED: ${{ steps.build.outputs.modified }}
          EXPECTED_ARCHIVE_IN: ${{ inputs.expected_archive }}
          BUILD_ARCHIVE: ${{ steps.build.outputs.archive }}
          EXPECTED_SYMBOL_IN: ${{ inputs.expected_symbol }}
          BUILD_SYMBOL: ${{ steps.build.outputs.symbol }}
          EXPECTED_DATA_IN: ${{ inputs.expected_data }}
          BUILD_DATA: ${{ steps.build.outputs.data }}
          EXPECTED_OBSERVATION_IN: ${{ inputs.expected_observation }}
          BUILD_OBSERVATION: ${{ steps.build.outputs.observation }}
          EXPECTED_CHARACTER_SELECT: ${{ inputs.expected_character_select }}
          EXPECTED_MATCH_START: ${{ inputs.expected_match_start }}
          MOVIE: ${{ inputs.movie }}
          EXPECTED_INPUT_AUTOMATION_READY: ${{ inputs.expected_input_automation_ready }}

        run: |
          set -euo pipefail
          MODIFIED_ISO="${MODIFIED_ISO_IN:-$BUILD_MODIFIED}"


          MODIFIED_ISO="${MODIFIED_ISO:-$CLEAN_ISO}"
          if [ -z "$MODIFIED_ISO_IN" ] && [ -z "$BUILD_MODIFIED" ]; then
            echo "PAS-24 build produced no modified ISO; refusing clean-vs-clean smoke" >&2
            exit 1
          fi
          ARCHIVE="${EXPECTED_ARCHIVE_IN:-$BUILD_ARCHIVE}"
          DATA="${EXPECTED_DATA_IN:-$BUILD_DATA}"
          echo "smoke: dolphin=$DOLPHIN clean=$CLEAN_ISO modified=$MODIFIED_ISO"
          echo "--- modified:"; ls -la "$MODIFIED_ISO" 2>&1
          echo "--- archive:";  ls -la "$ARCHIVE" 2>&1
          echo "--- data:";     ls -la "$DATA" 2>&1
          ARGS=(--dolphin "$DOLPHIN" --clean "$CLEAN_ISO" --modified "$MODIFIED_ISO")
          EXPECTED_SYMBOL="${EXPECTED_SYMBOL_IN:-$BUILD_SYMBOL}"
          EXPECTED_OBSERVATION="${EXPECTED_OBSERVATION_IN:-$BUILD_OBSERVATION}"
          ARGS+=(--expected-archive "$ARCHIVE" --expected-data "$DATA")
          ARGS+=(--expected-symbol "$EXPECTED_SYMBOL" --expected-observation "$EXPECTED_OBSERVATION")
          ARGS+=(--expected-character-select "$EXPECTED_CHARACTER_SELECT" --expected-match-start "$EXPECTED_MATCH_START")
          ARGS+=(--expected-input-automation-ready "$EXPECTED_INPUT_AUTOMATION_READY")
          if [ -n "$MOVIE" ]; then
            test -f "$MOVIE"
            ARGS+=(--movie "$MOVIE")
          fi

          PYTHONPATH=host/src python tooling/dolphin_smoke.py \
            "${ARGS[@]}" \
            --timeout 30 | tee /tmp/smoke.json
          # PAS-31 gate: the modified ISO must boot and emit loader,
          # character-select, and offline-match markers from the linked DOL.
          python -c "import json; p=json.load(open('/tmp/smoke.json')); assert p['both_started'], p; c=p['custom_fighter']; assert c['passed'] and c['checks'].get('archive_exists') and c['checks'].get('data_exists') and c['checks'].get('input_automation_ready'), c; print('PAS-24 gate passed:', c['checks'])"
      - name: Run non-game integration tests
        run: PYTHONPATH=host/src python -m unittest discover -s host/tests -v
