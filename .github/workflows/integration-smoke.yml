name: integration-smoke
# Manual, user-data-only Dolphin smoke, pinned to the self-hosted runner label.
# Self-contained: builds the modified ISO on the runner from the runner's own
# clean ISO plus the synthetic fixture in tooling/fixtures/pas23/. PAS-24
# overlays the Studio-composed fighter archive onto its clone-slot file so
# the game image references the custom bytes. Dispatch with no inputs.
# No game data is stored by the repo.
on:
  workflow_dispatch:
    inputs:
      dolphin:
        description: Absolute path to dolphin-emu (blank = auto-detect on the runner)
        required: false
        type: string
      clean_iso:
        description: Absolute path to the clean GALE01 Rev.02 ISO (blank = auto-detect)
        required: false
        type: string
      modified_iso:
        description: Absolute path to the modified ISO (blank = reuse clean)
        required: false
        type: string
      movie:
        description: Runner-local Dolphin TAS movie/DTM file
        required: false
        type: string
      record_movie:
        description: Record a legitimate DTM on the self-hosted runner
        required: false
        default: false
        type: boolean
      expected_archive:
        description: Runner-local custom fighter archive expected after conversion
        required: false
        type: string
      expected_symbol:
        description: Custom fighter load symbol or log marker
        required: false
        type: string
      expected_data:
        description: Runner-local custom fighter data file expected after conversion
        required: false
        type: string
      expected_observation:
        description: In-game observation marker emitted by the linked OSReport hook
        required: false
        default: CUSTOM_FIGHTER_VISIBLE
        type: string
      decomp_repo:
        description: Runner-local pinned doldecomp/melee checkout
        required: true
        type: string
      decomp_orig:
        description: Runner-local extracted orig/GALE01 directory
        required: true
        type: string
      expected_character_select:
        description: Character-select completion marker emitted by the runtime
        required: false
        default: CHARACTER_SELECT_COMPLETE
        type: string
      expected_match_start:
        description: Offline-match start marker emitted by the runtime
        required: false
        default: OFFLINE_MATCH_STARTED
        type: string
      expected_input_automation_ready:
        description: Input automation readiness marker emitted after menu navigation
        required: false
        default: INPUT_AUTOMATION_READY
        type: string

jobs:
  record:
    if: inputs.record_movie == true
    runs-on: [self-hosted, meleemod-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure X11 input control
        shell: bash
        run: tools/ensure-xdotool.sh
      - name: Record legitimate DTM
        shell: bash
        env:
          DOLPHIN: ${{ inputs.dolphin }}
          ISO: ${{ inputs.clean_iso }}
          MAX_SECONDS: "120"
        run: |
          set -euo pipefail
          test -n "${DISPLAY:-}" || { echo "DISPLAY is required" >&2; exit 2; }
          command -v xdotool >/dev/null || { echo "xdotool is required" >&2; exit 2; }
          [ -x "$DOLPHIN" ] || DOLPHIN="$(command -v dolphin-emu || true)"
          [ -x "$DOLPHIN" ] || { echo "Dolphin executable not found" >&2; exit 2; }
          [ -f "$ISO" ] || ISO="$(find "$HOME" /home -maxdepth 6 -type f -iname '*.iso' 2>/dev/null | head -1)"
          [ -f "$ISO" ] || { echo "Melee ISO not found" >&2; exit 2; }
          DTM="$RUNNER_TEMP/pas44-menu-to-match.dtm"
          LOG="$RUNNER_TEMP/pas44-dolphin.log"
          STATE="$RUNNER_TEMP/pas44-dolphin-state.txt"
          REPLAY_LOG="$RUNNER_TEMP/pas44-dolphin-replay.log"
          HOTKEYS="$HOME/.config/dolphin-emu/Hotkeys.ini"
          rm -f "$DTM" "$LOG" "$STATE" "$REPLAY_LOG"
          dump_state() {
            printf '%s\n' "--- visible windows ---"
            xdotool search --onlyvisible --name '' 2>/dev/null | while read -r id; do
              printf 'window=%s name=' "$id"
              xdotool getwindowname "$id" 2>/dev/null || true
            done
            wmctrl -l 2>/dev/null || true
            printf '%s\n' "--- dolphin version ---"
            "$DOLPHIN" --version 2>&1 | head -n 5 || true
            printf '%s\n' "--- movie hotkeys ---"
            grep -iE 'movie|record|playback' "$HOTKEYS" 2>/dev/null || true
            printf '%s\n' "--- dolphin log tail ---"
            tail -n 80 "$LOG" 2>/dev/null || true
          }
          "$DOLPHIN" -e "$ISO" >"$LOG" 2>&1 &
          PID=$!
          trap 'dump_state; kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          sleep 5
          WINDOW=""
          for _ in $(seq 1 30); do
            WINDOW="$(xdotool search --onlyvisible --name 'Dolphin' 2>/dev/null | head -1 || true)"
            [ -n "$WINDOW" ] || WINDOW="$(xdotool search --onlyvisible --class dolphin 2>/dev/null | head -1 || true)"
            [ -n "$WINDOW" ] && break
            sleep 1
          done
          if [ -z "$WINDOW" ]; then
            ps -ef | grep -i '[d]olphin' || true
            dump_state
            echo "Dolphin window not found" >&2
            exit 1
          fi
          xdotool windowactivate --sync "$WINDOW"
          sleep 3
          dump_state
          printf '%s\n' 'Recording real menu input movie through Dolphin'
          rm -f "$DTM"
          xdotool key ctrl+F11
          sleep 12
          xdotool key Return
          sleep 4
          xdotool key Return
          sleep 4
          xdotool key Return
          sleep 4
          xdotool key Return
          sleep 8
          xdotool key ctrl+F11
          sleep 2
          xdotool key ctrl+s
          sleep 2
          DIALOG=""
          for _ in $(seq 1 30); do
            DIALOG="$(xdotool search --onlyvisible --name 'Save Recording File As' 2>/dev/null | head -1 || true)"
            [ -n "$DIALOG" ] || DIALOG="$(xdotool search --onlyvisible --name 'Save' 2>/dev/null | head -1 || true)"
            [ -n "$DIALOG" ] && break
            sleep 1
          done
          [ -n "$DIALOG" ] || { dump_state; echo 'Save Recording File As dialog not found' >&2; exit 1; }
          timeout 5s xdotool windowactivate --sync "$DIALOG"
          xdotool key ctrl+a
          xdotool type --delay 20 "$DTM"
          xdotool key Return
          sleep 8
          test -s "$DTM" || { dump_state; echo 'Dolphin recording did not produce a DTM' >&2; exit 1; }
          dump_state >"$STATE"
          test -s "$STATE"
          FRAME_COUNT=$(python3 -c 'import struct,sys; print(struct.unpack_from("<Q", open(sys.argv[1], "rb").read(29), 13)[0])' "$DTM")
          REPLAY_BUDGET=$(( (FRAME_COUNT + 59) / 60 + 10 ))
          REPLAY_STATUS=0
           timeout "$REPLAY_BUDGET" "$DOLPHIN" -v Null -a HLE -e "$ISO" -m "$DTM" >"$REPLAY_LOG" 2>&1 || REPLAY_STATUS=$?

          printf 'replay_status=%s frame_count=%s replay_budget_seconds=%s\n' "$REPLAY_STATUS" "$FRAME_COUNT" "$REPLAY_BUDGET"
          grep -Eiq 'movie|DTM|GALE01|Starting' "$REPLAY_LOG" || { cat "$REPLAY_LOG"; exit 1; }
          test "$REPLAY_STATUS" -eq 0 -o "$REPLAY_STATUS" -eq 124 || {
            printf '%s\n' 'Dolphin replay exited before the bounded movie budget' >&2
            tail -n 80 "$REPLAY_LOG"
            exit 1
          }
          grep -Ei 'movie|DTM|GALE01|Starting' "$REPLAY_LOG" | tail -n 80
          ls -l "$DTM" "$STATE"
          tail -n 80 "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: pas44-dtm
          path: |
            ${{ runner.temp }}/pas44-menu-to-match.dtm
            ${{ runner.temp }}/pas44-dolphin-state.txt
            ${{ runner.temp }}/pas44-dolphin.log
            ${{ runner.temp }}/pas44-dolphin-replay.log
          if-no-files-found: error

  smoke:
    runs-on: [self-hosted, meleemod-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Report executed checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "checkout_ref=$(git symbolic-ref --short -q HEAD || true)"
          git show -s --format='checkout_commit=%H %D %s' HEAD
      - name: Download recorded movie
        if: inputs.record_movie == true && inputs.movie == ''
        uses: actions/download-artifact@v4
        with:
          name: pas44-dtm
          path: ${{ runner.temp }}/pas44-dtm
      - name: Resolve emulator and game data
        id: resolve
        shell: bash
        run: |
          set +e
          echo "runner=$(hostname) user=$(whoami) home=$HOME display=${DISPLAY:-<unset>} pwd=$(pwd)"
          INPUT_DOLPHIN="${{ inputs.dolphin }}"
          C="${{ inputs.clean_iso }}"
          echo "--- provided dolphin=$INPUT_DOLPHIN"; ls -la "$INPUT_DOLPHIN" 2>&1
          echo "--- provided clean=$C";   ls -la "$C" 2>&1
          D="/usr/bin/dolphin-emu"
          [ -x "$D" ] || D="$INPUT_DOLPHIN"
          [ -x "$D" ] || D="$(command -v dolphin-emu 2>/dev/null || true)"
          [ -n "$D" ] || D="$(find "$HOME/Downloads" "$HOME/.config/Slippi Launcher" -maxdepth 4 -type f \( -iname 'dolphin-emu' -o -iname 'Dolphin*.AppImage' \) 2>/dev/null | head -1)"
          [ -n "$D" ] || D="$(find /usr /opt /home -maxdepth 6 -type f \( -iname 'dolphin-emu' -o -iname 'Dolphin*.AppImage' \) 2>/dev/null | head -1)"
          [ -n "$D" ] || { echo 'GUI dolphin-emu binary not found; refusing nogui fallback' >&2; exit 2; }
          case "$(basename "$D")" in *nogui*) echo "resolved binary is headless-only: $D" >&2; exit 2 ;; esac
          [ -f "$C" ] || C="$(find "$HOME" /home -maxdepth 6 -type f -iname '*.iso' 2>/dev/null | head -1)"
          echo "resolved dolphin=$D"; ls -la "$D" 2>&1
          echo "resolved clean=$C";   ls -la "$C" 2>&1
          mkdir -p "${RUNNER_TEMP:-/tmp}/pas99-dolphin-logs"
          { echo "binary=$D"; echo "path=$D"; echo "version:"; "$D" --version 2>&1 || true; } | tee "${RUNNER_TEMP:-/tmp}/pas99-dolphin-logs/resolved-binary.txt"
          { echo "dolphin=$D"; echo "clean=$C"; } >> "$GITHUB_OUTPUT"

      - name: Build linked DOL and modified ISO on the runner
        id: build
        shell: bash
        env:
          CLEAN_ISO: ${{ steps.resolve.outputs.clean }}
          DECOMP_REPO: ${{ inputs.decomp_repo }}
          DECOMP_ORIG: ${{ inputs.decomp_orig }}
          OBSERVATION: ${{ inputs.expected_observation }}
        run: |
          set -euo pipefail
          FIXTURE="$GITHUB_WORKSPACE/tooling/fixtures/pas23"
          OUT="${RUNNER_TEMP:-/tmp}/pas23-modified.iso"
          PYTHONPATH=host/src python tooling/build_pas24_modified_iso.py \
            --clean "$CLEAN_ISO" --fixture "$FIXTURE" --output "$OUT" \
            --decomp-repo "$DECOMP_REPO" --orig "$DECOMP_ORIG" \
            --observation "$OBSERVATION" | tee "${RUNNER_TEMP:-/tmp}/pas24-build.json"
          test -s "$OUT"
          echo "modified=$OUT" >> "$GITHUB_OUTPUT"
          echo "archive=$FIXTURE/leesin-hsd-2e.melee-character" >> "$GITHUB_OUTPUT"
          echo "data=$FIXTURE/leesin-patched.hsd" >> "$GITHUB_OUTPUT"
          echo "symbol=ftDataLeesinhsd2e" >> "$GITHUB_OUTPUT"
          echo "observation=$OBSERVATION" >> "$GITHUB_OUTPUT"

      - name: Clear stale Dolphin process state
        shell: bash
        run: |
          set -euo pipefail
          echo "--- Dolphin processes before cleanup ---"
          ps -ef | grep '[d]olphin' || true
          pkill -9 -u "$(id -u)" -f '[d]olphin-emu' || true
          sleep 1
          echo "--- Dolphin processes after cleanup ---"
          ps -ef | grep '[d]olphin' || true
          # Zombies (<defunct>, state Z) cannot be killed; only their parent
          # can reap them. Fail only on live (non-zombie) processes.
          LEFTOVER="$(ps -u "$(id -u)" -o stat=,args= 2>/dev/null | grep '[d]olphin-emu' | grep -v '<defunct>' | grep -v '^[[:space:]]*Z' || true)"
          if [ -n "$LEFTOVER" ]; then
            echo "stale live dolphin-emu process remains after cleanup:" >&2
            printf '%s\n' "$LEFTOVER" >&2
            exit 1
          fi

      - name: Capture Dolphin startup diagnostics
        shell: bash
        env:
          DOLPHIN: ${{ steps.resolve.outputs.dolphin }}
          CLEAN_ISO: ${{ steps.resolve.outputs.clean }}
          MODIFIED_ISO: ${{ steps.build.outputs.modified }}
        run: |
          set -u
          echo "--- Dolphin version ---"
          "$DOLPHIN" --version 2>&1 || true
          echo "--- DISPLAY ---"
          printf '%s\n' "${DISPLAY:-<unset>}"
          echo "--- display geometry ---"
          xdotool getdisplaygeometry 2>&1 || xdpyinfo 2>&1 || true
          echo "--- resolved ISO files ---"
          ls -l "$CLEAN_ISO" "$MODIFIED_ISO" 2>&1
          echo "--- Dolphin help/backend list ---"
          mkdir -p "${RUNNER_TEMP:-/tmp}/pas99-dolphin-logs"
          "$DOLPHIN" --help 2>&1 | tee "${RUNNER_TEMP:-/tmp}/pas99-dolphin-logs/dolphin-help.log" || true


      - name: Run bounded clean/modified Dolphin smoke
        shell: bash

        env:
          DOLPHIN: ${{ steps.resolve.outputs.dolphin }}
          CLEAN_ISO: ${{ steps.resolve.outputs.clean }}
          MODIFIED_ISO_IN: ${{ inputs.modified_iso }}
          BUILD_MODIFIED: ${{ steps.build.outputs.modified }}
          EXPECTED_ARCHIVE_IN: ${{ inputs.expected_archive }}
          BUILD_ARCHIVE: ${{ steps.build.outputs.archive }}
          EXPECTED_SYMBOL_IN: ${{ inputs.expected_symbol }}
          BUILD_SYMBOL: ${{ steps.build.outputs.symbol }}
          EXPECTED_DATA_IN: ${{ inputs.expected_data }}
          BUILD_DATA: ${{ steps.build.outputs.data }}
          EXPECTED_OBSERVATION_IN: ${{ inputs.expected_observation }}
          BUILD_OBSERVATION: ${{ steps.build.outputs.observation }}
          EXPECTED_CHARACTER_SELECT: ${{ inputs.expected_character_select }}
          EXPECTED_MATCH_START: ${{ inputs.expected_match_start }}
          MOVIE: ${{ inputs.movie }}
          EXPECTED_INPUT_AUTOMATION_READY: ${{ inputs.expected_input_automation_ready }}
          SMOKE_LOG_DIR: ${{ runner.temp }}/pas99-dolphin-logs
          SMOKE_USER_DIR: ${{ runner.temp }}/pas99-dolphin-user


        run: |


          set -euo pipefail
          # PAS-165 host root cause: the runner tab exports QT_QPA_PLATFORM=xcb
          # (plus QT_XCB_NO_XI2/QT_WAYLAND_RECONNECT) for xdotool in the record
          # job. Dolphin 2606 stalls/SIGILLs during movie playback under that Qt
          # env, while native Wayland playback passes. Neutralise the xcb vars
          # for this smoke job only; the record job keeps xcb for xdotool.
          unset QT_QPA_PLATFORM QT_XCB_NO_XI2 QT_WAYLAND_RECONNECT
          cleanup_smoke_children() {
            local children
            children="$(jobs -pr)"
            if [ -n "$children" ]; then
              kill -KILL $children 2>/dev/null || true
            fi
          }
          trap cleanup_smoke_children EXIT
          trap 'cleanup_smoke_children; exit 143' TERM INT
          MODIFIED_ISO="${MODIFIED_ISO_IN:-$BUILD_MODIFIED}"
          MODIFIED_ISO="${MODIFIED_ISO:-$CLEAN_ISO}"
          mkdir -p "$SMOKE_LOG_DIR" "$SMOKE_USER_DIR"
          if [ -n "${DISPLAY:-}" ]; then
            XVFB_PREFIX=()
          else
            command -v xvfb-run >/dev/null || { echo "DISPLAY is unset and xvfb-run is unavailable" >&2; exit 2; }
            XVFB_PREFIX=(xvfb-run -a)
          fi
          PROBE_FAILED=0
          run_probe() {
             local name="$1" iso="$2" user_dir="$3" backend="$4" audio="$5" status=0
             local log="$SMOKE_LOG_DIR/${name}.log"
            local stdout_log="$SMOKE_LOG_DIR/${name}.stdout.log"
            local stderr_log="$SMOKE_LOG_DIR/${name}.stderr.log"
             local command=("$DOLPHIN" -b -e "$iso" -u "$user_dir")
             [ -n "$backend" ] && command+=( -C "$backend" -C Core.DSPHLE=True )
             [ -n "$audio" ] && command+=( -a "$audio" )
             printf 'probe_command=%q ' "${XVFB_PREFIX[@]}" timeout 30 "${command[@]}"
             printf '\n'

             rm -rf "$user_dir"
             mkdir -p "$user_dir"
             set +e
             "${XVFB_PREFIX[@]}" timeout --signal=TERM --kill-after=5 30 "${command[@]}" \
               >"$stdout_log" 2>"$stderr_log"
             status=$?
             cat "$stdout_log" "$stderr_log" >"$log"
             set -e

              signal_name=""
              timeout_phase="none"
              if [ "$status" -eq 124 ]; then signal_name="TIMEOUT"; timeout_phase="TERM"; fi
              if [ "$status" -eq 135 ]; then signal_name="SIGBUS"; fi
              if [ "$status" -eq 137 ]; then signal_name="SIGKILL"; timeout_phase="KILL"; fi
              if [ "$status" -eq 139 ]; then signal_name="SIGSEGV"; fi
              startup_marker=0
              if grep -Eq 'Active title: (GALE01|[A-Z0-9]{6})' "$log"; then startup_marker=1; fi
              {
                printf 'probe=%s exit_code=%s signal=%s timeout_phase=%s startup_marker=%s timeout_is_bounded_live_process=%s\n' "$name" "$status" "$signal_name" "$timeout_phase" "$startup_marker" "$([ "$status" -eq 124 ] || [ "$status" -eq 137 ] && echo 1 || echo 0)"
                printf '%s\n' '--- process snapshot ---'
                ps -eo pid,ppid,stat,etime,rss,cmd | grep '[d]olphin' || true
                printf '%s\n' '--- memory/cgroup snapshot ---'
                free -h 2>&1 || true
                for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events; do [ -r "$f" ] && { printf '%s: ' "$f"; tr '\n' ' ' <"$f"; printf '\n'; }; done
                printf '%s\n' '--- kernel evidence ---'
                dmesg --level=err,warn 2>&1 | tail -n 80 || true
                journalctl -k --since '-2 minutes' --no-pager 2>&1 | tail -n 80 || true
                printf '%s\n' '--- coredump evidence ---'
                coredumpctl --no-pager info "$DOLPHIN" 2>&1 || true
              } >>"$log"
              printf 'probe=%s exit_code=%s signal=%s timeout_phase=%s startup_marker=%s\n' "$name" "$status" "$signal_name" "$timeout_phase" "$startup_marker"
             if [ "$status" -eq 135 ] || [ "$status" -eq 139 ] || { [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; } || [ "$startup_marker" -ne 1 ]; then PROBE_FAILED=1; fi

          }
           run_probe boot-only-clean "$CLEAN_ISO" "$SMOKE_USER_DIR/boot-only-clean" "" ""
           run_probe boot-only-null-av-clean "$CLEAN_ISO" "$SMOKE_USER_DIR/boot-only-null-av-clean" "Core.GFXBackend=Null" "Null"
           run_probe boot-only-null-av-modified "$MODIFIED_ISO" "$SMOKE_USER_DIR/boot-only-null-av-modified" "Core.GFXBackend=Null" "Null"
          if [ "$PROBE_FAILED" -ne 0 ]; then
            echo "Dolphin boot probe failed; skipping DTM playback"
            "${XVFB_PREFIX[@]}" env PYTHONPATH=host/src python tooling/dolphin_smoke.py \
              --dolphin "$DOLPHIN" --clean "$CLEAN_ISO" --modified "$MODIFIED_ISO" \
              --log-dir "$SMOKE_LOG_DIR" --diagnostics-dir "$SMOKE_LOG_DIR/diagnostics" \
              --user-dir "$SMOKE_USER_DIR" --timeout 30 \
              | tee "$RUNNER_TEMP/smoke.json" || true
            exit 1
          fi

          MODIFIED_ISO="${MODIFIED_ISO:-$CLEAN_ISO}"

          if [ -z "$MOVIE" ] && [ "${{ inputs.record_movie }}" = "true" ]; then
            MOVIE="$RUNNER_TEMP/pas44-dtm/pas44-menu-to-match.dtm"
          fi
          if [ -z "$MOVIE" ]; then
            MOVIE="$GITHUB_WORKSPACE/tooling/fixtures/tasvideos-2505M-numerics.dtm"
          fi
          if [ -z "$MODIFIED_ISO_IN" ] && [ -z "$BUILD_MODIFIED" ]; then

            echo "PAS-24 build produced no modified ISO; refusing clean-vs-clean smoke" >&2
            exit 1
          fi
          ARCHIVE="${EXPECTED_ARCHIVE_IN:-$BUILD_ARCHIVE}"
          DATA="${EXPECTED_DATA_IN:-$BUILD_DATA}"
          echo "smoke: dolphin=$DOLPHIN clean=$CLEAN_ISO modified=$MODIFIED_ISO"
          echo "--- modified:"; ls -la "$MODIFIED_ISO" 2>&1
          echo "--- archive:";  ls -la "$ARCHIVE" 2>&1
          echo "--- data:";     ls -la "$DATA" 2>&1
          ARGS=(--dolphin "$DOLPHIN" --clean "$CLEAN_ISO" --modified "$MODIFIED_ISO")
          EXPECTED_SYMBOL="${EXPECTED_SYMBOL_IN:-$BUILD_SYMBOL}"
          EXPECTED_OBSERVATION="${EXPECTED_OBSERVATION_IN:-$BUILD_OBSERVATION}"
          ARGS+=(--expected-archive "$ARCHIVE" --expected-data "$DATA")
          ARGS+=(--expected-symbol "$EXPECTED_SYMBOL" --expected-observation "$EXPECTED_OBSERVATION")
          ARGS+=(--expected-character-select "$EXPECTED_CHARACTER_SELECT" --expected-match-start "$EXPECTED_MATCH_START")
          ARGS+=(--expected-input-automation-ready "$EXPECTED_INPUT_AUTOMATION_READY")
          SMOKE_TIMEOUT=30
          if [ -n "$MOVIE" ]; then
            test -f "$MOVIE"
            python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(); assert d[:4]==b"DTM\x1a", "movie is not a raw DTM file"; assert d[4:10].rstrip(b"\x00")==b"GALE01", "DTM game id must be GALE01"; assert d[10]==0, "DTM must be a GameCube movie"; assert d[11]&0x01, "DTM must enable GC controller 1"; assert d[12]==0, "DTM must start from boot"; f=struct.unpack_from("<Q",d,13)[0]; assert f>0, "DTM has no frames"; print("dtm ok game=GALE01 controllers=%#04x frames=%d" % (d[11],f))' "$MOVIE"
            ARGS+=(--movie "$MOVIE")
            SMOKE_TIMEOUT=$(python3 -c 'import struct,sys;d=open(sys.argv[1],"rb").read();f=struct.unpack_from("<Q",d,13)[0];print(max(60,int(f/60)+60))' "$MOVIE")
          fi

          echo "dolphin_smoke_command=${XVFB_PREFIX[*]} env PYTHONPATH=host/src python tooling/dolphin_smoke.py ${ARGS[*]} --log-dir $SMOKE_LOG_DIR --user-dir $SMOKE_USER_DIR --timeout $SMOKE_TIMEOUT"
          "${XVFB_PREFIX[@]}" env PYTHONPATH=host/src python tooling/dolphin_smoke.py \
            "${ARGS[@]}" \
            --log-dir "$SMOKE_LOG_DIR" \
            --diagnostics-dir "$SMOKE_LOG_DIR/diagnostics" \
            --user-dir "$SMOKE_USER_DIR" \
            --timeout "$SMOKE_TIMEOUT" | tee "$RUNNER_TEMP/smoke.json"



          # PAS-99 gate: movie playback must be entered (bounded tail is never
          # silently empty) and the modified ISO must emit loader,
          # character-select, offline-match, and input-automation markers
          # from actual Dolphin output. No synthesized bytes or markers.
          # PAS-154: Dolphin 2606 enters playback via `-e <iso> -m <dtm>`

          # (MainWindow PlayInput path); raw DTM/GALE01 metadata is validated
          # above and echoed here, so `movie playback not entered` points at
          # the emulator/boot path rather than a wrapped or mismatched movie.
          python -c "import json; p=json.load(open('$RUNNER_TEMP/smoke.json')); print('bounded tails:'); [print('---', r.get('game'), 'len=', r.get('output_len'), 'log=', r.get('log_file'), 'log_len=', r.get('log_len'), 'movie=', r.get('movie'), 'exists=', r.get('movie_exists'), 'meta=', r.get('movie_metadata'), 'err=', r.get('movie_error'), 'playback=', r.get('playback')) for r in p['results']]; [print(r.get('output_tail','')[-2000:]) for r in p['results']]; assert all(not r.get('movie_error') for r in p['results'] if r.get('movie')), 'invalid DTM metadata'; assert p['both_started'], p; c=p['custom_fighter']; assert c['passed'] and c['checks'].get('archive_exists') and c['checks'].get('data_exists') and c['checks'].get('character_select_complete') and c['checks'].get('offline_match_started') and c['checks'].get('input_automation_ready'), c; assert all(r.get('log_len', 0) > 0 for r in p['results']), 'empty Dolphin log is a diagnostic failure'; assert all((r.get('playback') or {}).get('movie_playback_entered') for r in p['results'] if r.get('movie')), 'movie playback not entered'; print('PAS-99 gate passed:', c['checks'])"

      - name: Upload raw Dolphin logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pas99-dolphin-logs
          path: |
            ${{ runner.temp }}/pas99-dolphin-logs/*
            ${{ runner.temp }}/smoke.json

          if-no-files-found: error
      - name: Run non-game integration tests
        run: PYTHONPATH=host/src python -m unittest discover -s host/tests -v
