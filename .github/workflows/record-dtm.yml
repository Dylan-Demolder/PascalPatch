name: record-dtm
on:
  workflow_dispatch:
    inputs:
      iso:
        description: Runner-local Melee ISO
        required: false
        type: string
      dolphin:
        description: Runner-local Dolphin executable
        required: false
        type: string
      seconds:
        description: Maximum recording duration
        required: false
        default: "120"
        type: string
jobs:
  record:
    runs-on: [self-hosted, meleemod-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure X11 input control
        shell: bash
        run: tools/ensure-xdotool.sh
      - name: Resolve runner inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DISPLAY:-}" || { echo "DISPLAY is required" >&2; exit 2; }
          command -v xdotool >/dev/null || { echo "xdotool is required" >&2; exit 2; }
          dolphin="${{ inputs.dolphin }}"
          iso="${{ inputs.iso }}"
          echo "runner=$(hostname) user=$(whoami) home=$HOME display=${DISPLAY:-<unset>} pwd=$(pwd)"
          echo "provided dolphin=$dolphin"; ls -la "$dolphin" 2>&1 || true
          echo "provided iso=$iso"; ls -la "$iso" 2>&1 || true
          [ -x "$dolphin" ] || dolphin="$(command -v dolphin-emu 2>/dev/null || true)"
          [ -n "$dolphin" ] || dolphin="$(command -v dolphin 2>/dev/null || true)"
          [ -n "$dolphin" ] || dolphin="$(find "$HOME/Downloads" "$HOME/.config/Slippi Launcher" -maxdepth 4 -type f -iname '*.AppImage' 2>/dev/null | head -1 || true)"
          [ -n "$dolphin" ] || dolphin="$(find /usr /opt /home -maxdepth 6 -type f \( -iname 'dolphin-emu*' -o -iname 'Dolphin*.AppImage' \) 2>/dev/null | head -1 || true)"
          [ -x "$dolphin" ] || dolphin="/usr/bin/dolphin-emu"
          [ -x "$dolphin" ] || { echo "Dolphin executable not found" >&2; exit 2; }
          [ -f "$iso" ] || iso="$(find "$HOME" /home -maxdepth 6 -type f -iname '*.iso' 2>/dev/null | head -1 || true)"
          [ -f "$iso" ] || iso="$HOME/Downloads/Super Smash Bros. Melee (USA) (En,Ja) (v1.02).iso"
          [ -f "$iso" ] || { echo "Melee ISO not found" >&2; exit 2; }
          echo "resolved dolphin=$dolphin"; ls -la "$dolphin"
          echo "resolved iso=$iso"; ls -la "$iso"
          printf 'dolphin=%s\niso=%s\n' "$dolphin" "$iso" >> "$GITHUB_OUTPUT"
      - name: Record menu-to-match movie
        shell: bash
        env:
          DOLPHIN: ${{ steps.resolve.outputs.dolphin }}
          ISO: ${{ steps.resolve.outputs.iso }}
          MAX_SECONDS: ${{ inputs.seconds }}
        run: |
          set -euo pipefail
          dtm="$RUNNER_TEMP/pas44-menu-to-match.dtm"
          log="$RUNNER_TEMP/pas44-dolphin.log"
          hotkeys="$HOME/.config/dolphin-emu/Hotkeys.ini"
          rm -f "$dtm" "$log"
          dump_state() {
            printf '%s\n' "--- visible windows ---"
            xdotool search --onlyvisible --name '' 2>/dev/null | while read -r id; do
              printf 'window=%s name=' "$id"
              xdotool getwindowname "$id" 2>/dev/null || true
            done
            wmctrl -l 2>/dev/null || true
            printf '%s\n' "--- dolphin version ---"
            "$DOLPHIN" --version 2>&1 | head -n 5 || true
            printf '%s\n' "--- movie hotkeys ---"
            grep -iE 'movie|record|playback' "$hotkeys" 2>/dev/null || true
            printf '%s\n' "--- dolphin log tail ---"
            tail -n 80 "$log" 2>/dev/null || true
          }
          "$DOLPHIN" -e "$ISO" >"$log" 2>&1 &
          dolphin_pid=$!
          finish() { dump_state; kill "$dolphin_pid" 2>/dev/null || true; wait "$dolphin_pid" 2>/dev/null || true; }
          trap finish EXIT
          sleep 5
          window=""
          for _ in $(seq 1 30); do
            window="$(xdotool search --onlyvisible --class dolphin-emu 2>/dev/null | while read -r id; do xdotool getwindowname "$id" 2>/dev/null | grep -q . && printf '%s' "$id" && break; done)"
            [ -n "$window" ] && break
            sleep 1
          done
          [ -n "$window" ] || { dump_state; exit 1; }
          timeout 5s xdotool windowactivate --sync "$window"
          dump_state
          sleep 3
          printf '%s\n' 'Authoring real menu input movie with GameCube button masks'
          python3 tooling/author_dtm.py "$dtm"
          test -s "$dtm" || { dump_state; echo 'Input movie authoring did not produce a DTM' >&2; exit 1; }
          replay_log="$RUNNER_TEMP/pas44-dolphin-replay.log"
          state_image="$RUNNER_TEMP/pas44-dolphin-state.png"
          if command -v import >/dev/null 2>&1; then
            import -window root "$state_image"
          elif command -v gnome-screenshot >/dev/null 2>&1; then
            gnome-screenshot -f "$state_image"
          else
            echo 'No screenshot tool available' >&2
            exit 2
          fi
          replay_status=0
          timeout "$MAX_SECONDS" "$DOLPHIN" -b -e "$ISO" -m "$dtm" >"$replay_log" 2>&1 || replay_status=$?
          printf 'replay_status=%s\n' "$replay_status"
          grep -Eiq 'movie|DTM|GALE01|Starting' "$replay_log" || { cat "$replay_log"; exit 1; }
          test "$replay_status" -eq 0 || {
            printf '%s\n' 'Movie replay did not terminate after full consumption' >&2
            tail -n 80 "$replay_log"
            exit 1
          }
          printf '%s\n' 'Movie replay consumed to process exit; runtime character/match markers are supplied by the linked runtime hook.'
          grep -Ei 'movie|DTM|GALE01|Starting' "$replay_log" | tail -n 80
          printf '%s\n' 'Recorded DTM:'
          ls -l "$dtm" "$state_image"
          printf '%s\n' 'Bounded Dolphin log tail:'
          tail -n 80 "$log"
      - uses: actions/upload-artifact@v4
        with:
          name: pas44-dtm
          path: |
            ${{ runner.temp }}/pas44-menu-to-match.dtm
            ${{ runner.temp }}/pas44-dolphin-state.png
            ${{ runner.temp }}/pas44-dolphin.log
            ${{ runner.temp }}/pas44-dolphin-replay.log
          if-no-files-found: error
