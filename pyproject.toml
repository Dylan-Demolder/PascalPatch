[build-system]
requires = []
build-backend = "backend"
backend-path = ["."]

[project]
name = "pascalpatch-host"
version = "0.6.0"
description = "Safe host-side profile and build tooling for PascalPatch"
requires-python = ">=3.11"

[project.scripts]
pascalpatch = "pascalpatch.cli:main"
meleemod = "pascalpatch.cli:main"   # the name before the rename

[tool.pytest.ini_options]
pythonpath = ["host/src"]
